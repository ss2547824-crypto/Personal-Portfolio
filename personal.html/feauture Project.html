<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Technology - Coming Soon</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #020617;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

/* Background */
.scene {
    width: 100%;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at center, #0b2a45 0%, #020617 45%, #000 100%);
}

/* Animated grid */
.grid {
    position: absolute;
    width: 200%;
    height: 100%;
    left: -50%;
    bottom: -45%;
    transform: perspective(500px) rotateX(65deg);
    background-image:
        linear-gradient(rgba(0, 229, 255, .18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 229, 255, .18) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridMove 4s linear infinite;
}

@keyframes gridMove {
    from {
        background-position: 0 0;
    }
    to {
        background-position: 0 60px;
    }
}

/* Main content */
.content {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    z-index: 5;
}

/* Small heading */
.badge {
    padding: 10px 22px;
    border: 1px solid #00eaff;
    border-radius: 30px;
    color: #00eaff;
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    box-shadow: 0 0 20px rgba(0,234,255,.4);
    animation: pulse 2s infinite;
}

@keyframes pulse {
    50% {
        box-shadow:
            0 0 10px #00eaff,
            0 0 40px rgba(0,234,255,.4);
    }
}

/* 3D text */
h1 {
    margin-top: 25px;
    font-size: clamp(55px, 9vw, 120px);
    font-weight: 900;
    letter-spacing: 10px;
    text-transform: uppercase;

    color: transparent;
    -webkit-text-stroke: 2px #00eaff;

    transform-style: preserve-3d;
    animation: text3d 4s ease-in-out infinite;
    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #008cff,
        0 0 60px rgba(0,234,255,.5);
}

@keyframes text3d {
    0%, 100% {
        transform: perspective(700px) rotateX(0deg) rotateY(-5deg);
    }

    50% {
        transform: perspective(700px) rotateX(8deg) rotateY(5deg);
    }
}

.subtitle {
    margin-top: 25px;
    font-size: clamp(16px, 2vw, 22px);
    color: #a5f3fc;
    letter-spacing: 5px;
    text-transform: uppercase;
}

/* Loading animation */
.loading {
    margin-top: 35px;
    width: 280px;
    height: 5px;
    border-radius: 10px;
    background: rgba(255,255,255,.1);
    overflow: hidden;
    box-shadow: 0 0 15px rgba(0,234,255,.2);
}

.loading-bar {
    width: 40%;
    height: 100%;
    background: linear-gradient(
        90deg,
        transparent,
        #00eaff,
        #ffffff,
        #00eaff,
        transparent
    );
    box-shadow: 0 0 20px #00eaff;
    animation: loading 2s infinite;
}

@keyframes loading {
    0% {
        transform: translateX(-150%);
    }

    100% {
        transform: translateX(400%);
    }
}

/* 3D rings */
.rings {
    position: absolute;
    width: 500px;
    height: 500px;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    transform-style: preserve-3d;
    pointer-events: none;
}

.ring {
    position: absolute;
    width: 100%;
    height: 100%;
    border: 1px solid rgba(0,234,255,.3);
    border-radius: 50%;
    box-shadow:
        0 0 20px rgba(0,234,255,.2),
        inset 0 0 20px rgba(0,234,255,.1);
}

.ring:nth-child(1) {
    transform: rotateX(65deg);
    animation: rotate1 8s linear infinite;
}

.ring:nth-child(2) {
    transform: rotateY(65deg);
    animation: rotate2 10s linear infinite;
}

.ring:nth-child(3) {
    transform: rotateX(65deg) rotateY(20deg);
    animation: rotate3 12s linear infinite reverse;
}

@keyframes rotate1 {
    to {
        transform: rotateX(65deg) rotateZ(360deg);
    }
}

@keyframes rotate2 {
    to {
        transform: rotateY(65deg) rotateZ(360deg);
    }
}

@keyframes rotate3 {
    to {
        transform: rotateX(65deg) rotateY(20deg) rotateZ(360deg);
    }
}

/* Particles */
.particle {
    position: absolute;
    width: 3px;
    height: 3px;
    background: #00eaff;
    border-radius: 50%;
    box-shadow: 0 0 12px #00eaff;
    animation: float 5s infinite ease-in-out;
}

.p1 { left: 10%; top: 20%; animation-delay: 0s; }
.p2 { left: 20%; top: 70%; animation-delay: 1s; }
.p3 { left: 80%; top: 25%; animation-delay: 2s; }
.p4 { left: 90%; top: 70%; animation-delay: 3s; }
.p5 { left: 65%; top: 15%; animation-delay: 1.5s; }
.p6 { left: 35%; top: 85%; animation-delay: 2.5s; }
.p7 { left: 50%; top: 10%; animation-delay: .5s; }
.p8 { left: 5%; top: 50%; animation-delay: 3.5s; }

@keyframes float {
    0%, 100% {
        transform: translateY(0) scale(1);
        opacity: .3;
    }

    50% {
        transform: translateY(-80px) scale(2);
        opacity: 1;
    }
}

/* Corner UI */
.corner {
    position: absolute;
    width: 70px;
    height: 70px;
    border-color: #00eaff;
    opacity: .6;
}

.top-left {
    top: 30px;
    left: 30px;
    border-top: 2px solid;
    border-left: 2px solid;
}

.top-right {
    top: 30px;
    right: 30px;
    border-top: 2px solid;
    border-right: 2px solid;
}

.bottom-left {
    bottom: 30px;
    left: 30px;
    border-bottom: 2px solid;
    border-left: 2px solid;
}

.bottom-right {
    bottom: 30px;
    right: 30px;
    border-bottom: 2px solid;
    border-right: 2px solid;
}

/* Mobile */
@media (max-width: 600px) {

    .rings {
        width: 300px;
        height: 300px;
    }

    h1 {
        letter-spacing: 4px;
        -webkit-text-stroke: 1px #00eaff;
    }

    .subtitle {
        letter-spacing: 2px;
        padding: 0 20px;
    }

    .loading {
        width: 220px;
    }
}
</style>
</head>

<body>

<div class="scene">

    <!-- Moving futuristic floor -->
    <div class="grid"></div>

    <!-- 3D Rings -->
    <div class="rings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>

    <!-- Floating particles -->
    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>
    <div class="particle p6"></div>
    <div class="particle p7"></div>
    <div class="particle p8"></div>

    <!-- Corner UI -->
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <!-- Main content -->
    <div class="content">

        <div class="badge">
            working on it
        </div>

        <h1>Coming Soon</h1>

        <div class="subtitle">
            The Future Is Being Built
        </div>

        <div class="loading">
            <div class="loading-bar"></div>
        </div>

    </div>

</div>

</body>
</html>
